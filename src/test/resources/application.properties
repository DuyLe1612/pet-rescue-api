# ===========================================
# TEST — H2 in-memory (no Docker needed for tests)
# ===========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway in tests — JPA auto-creates schema
spring.flyway.enabled=false

# JWT — static dev secret (Base64-encoded, ≥256 bits)
app.security.jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IHBsZWFzZSBjaGFuZ2UgaW4gcHJvZA==
app.security.jwt.access-token-expiration-ms=900000
app.security.jwt.issuer=pet-rescue-api-test

# Fake Cloudinary credentials so the client bean can be created
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
cloudinary.temp-folder=temp
cloudinary.permanent-folder=pet-rescue

# Disable actual email sending in tests
spring.mail.host=localhost
spring.mail.port=25

# Application settings the context needs; external brokers stay offline
app.security.refresh-token.expiry-days=7
app.security.login.max-attempts=5
app.security.login.lockout-duration-minutes=30
app.security.login.attempt-ttl-minutes=30
app.email.from=noreply@petrescue.test
app.email.verification-url=http://localhost/verify
app.email.verification-token-expiry-minutes=3
app.email.password-reset-url=http://localhost/reset
app.email.password-reset-token-expiry-minutes=5
app.cors.allowed-origins=*
spring.rabbitmq.listener.simple.auto-startup=false
app.rabbit.listener.concurrency=1
app.rabbit.listener.max-concurrency=1
app.rabbitmq.exchange.social=social.exchange
app.rabbitmq.queue.post-liked=social.post.liked
app.rabbitmq.queue.post-unliked=social.post.unliked
app.rabbitmq.queue.comment-created=social.comment.created
app.rabbitmq.queue.comment-liked=social.comment.liked
app.rabbitmq.queue.comment-unliked=social.comment.unliked
app.rabbitmq.routing-key.post-liked=post.liked
app.rabbitmq.routing-key.post-unliked=post.unliked
app.rabbitmq.routing-key.comment-created=comment.created
app.rabbitmq.routing-key.comment-liked=comment.liked
app.rabbitmq.routing-key.comment-unliked=comment.unliked
app.redis.key.post-likes=post:%s:likes
app.redis.key.comment-likes=comment:%s:likes
app.redis.key.post-comment-count=post:%s:comment_count
app.redis.key.comment-reply-count=comment:%s:reply_count
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.auto-index-creation=false
app.ai.post-analysis.enabled=false
app.ai.post-analysis.model=claude-opus-5-5
app.ai.post-analysis.allowed-models=claude-haiku-5-5,claude-opus-5-5
app.ai.gemini.api-key=
app.ai.post-analysis.retry-delay-ms=60000
