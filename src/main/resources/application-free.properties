# =============================================================
# Profile: free — 512 MB container (Fly / Render / Koyeb free tier)
# =============================================================
# Activated by default via `spring.profiles.default=free` in
# application.properties. Override with SPRING_PROFILES_ACTIVE=scale.
#
# JVM heap is ~256 MB (JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 in Dockerfile).
# The rest of the budget goes to (measured: ~425 MB idle, ~476 MB under load):
#   - ~130 MB metaspace, capped at 180 MB (Spring/Hibernate/Mongo/AMQP/Anthropic SDK)
#   - code cache (48 MB cap), thread stacks (512 KB each), GC + native
#
# Keep this profile conservative. Test the app boots cleanly under this
# profile before shipping.

# --- Database connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# --- Tomcat HTTP threads ---
server.tomcat.threads.max=30

# --- RabbitMQ listener concurrency ---
# 5 listeners × 1 consumer each = max 5 listener threads (~2.5 MB stack).
app.rabbit.listener.concurrency=1
app.rabbit.listener.max-concurrency=1