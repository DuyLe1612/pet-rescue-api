# =============================================================
# Profile: scale — 1.5 GB container (single-VM prod)
# =============================================================
# Activate with: SPRING_PROFILES_ACTIVE=scale
# Heap: ~1.05 GB via JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.
# Suitable for ~100 concurrent users.

# --- Database connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- Tomcat HTTP threads ---
server.tomcat.threads.max=80
server.tomcat.accept-count=40
server.tomcat.max-connections=600

# --- RabbitMQ listener concurrency ---
# 5 listeners × up to 2 consumers each = max 10 listener threads (~5 MB stack).
app.rabbit.listener.concurrency=1
app.rabbit.listener.max-concurrency=2

# --- WebSocket session pruning (scale only — saves a scheduler wakeup on free) ---
app.websocket.prune-sessions=true